<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio del Bosque LP - En Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f1a14, #142218);
    color: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}
.container { text-align: center; max-width: 400px; width: 100%; }
.logo {
    width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid #d4a574; margin-bottom: 24px;
    box-shadow: 0 0 30px rgba(212, 165, 116, 0.3);
    object-fit: cover;
}
.title { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 8px; }
.subtitle { font-size: 0.9rem; color: #b8b0a0; margin-bottom: 30px; letter-spacing: 0.05em; }
audio { 
    width: 100%; max-width: 360px; border-radius: 50px; 
    outline: none; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}
.status { font-size: 0.85rem; color: #5fbf8a; margin-top: 20px; font-weight: 600; min-height: 1.2em; }
.hint { font-size: 0.75rem; color: #7a7568; margin-top: 24px; font-style: italic; opacity: 0.8; }
</style>
</head>
<body>
<div class="container">
    <img src="images/logo_radio.png" alt="Radio del Bosque LP" class="logo">
    <h1 class="title">Radio del Bosque LP</h1>
    <p class="subtitle">TRANSMISIÓN EN VIVO 24/7</p>
    
    <audio id="streamAudio" controls autoplay preload="none">
        <source src="" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
    </audio>
    
    <div id="statusText" class="status">INICIANDO...</div>
    <p class="hint">💡 Minimiza esta ventana para seguir navegando</p>
</div>

<script>
(function() {
    const audio = document.getElementById('streamAudio');
    const statusText = document.getElementById('statusText');
    // URL CORRECTA CON ANTI-CACHE
    const STREAM_URL = 'https://uk5freenew.listen2myradio.com/live.mp3?typeportmount=s1_8707_stream_684679610&t=' + Date.now();
    audio.src = STREAM_URL;

    let retryInterval = null;

    function updateStatus(msg, color) {
        statusText.textContent = msg;
        statusText.style.color = color || '#5fbf8a';
    }

    function tryPlay() {
        const promise = audio.play();
        if (promise !== undefined) {
            promise.then(() => {
                updateStatus('▶ EN VIVO', '#5fbf8a');
                if(retryInterval) clearInterval(retryInterval);
            }).catch(() => {
                updateStatus('⏸ TOCA PLAY PARA ESCUCHAR', '#d4a574');
            });
        }
    }

    window.addEventListener('load', () => setTimeout(tryPlay, 500));
    document.addEventListener('click', () => { if(audio.paused) tryPlay(); }, { once: true });

    audio.addEventListener('stalled', () => updateStatus('⚠ RECONECTANDO...', '#e89850'));
    audio.addEventListener('error', () => {
        updateStatus('❌ SEÑAL INTERRUMPIDA', '#e63946');
        if (!retryInterval) {
            retryInterval = setInterval(() => {
                audio.src = STREAM_URL + '&r=' + Date.now();
                audio.load();
                tryPlay();
            }, 5000);
        }
    });
    audio.addEventListener('playing', () => {
        updateStatus('▶ EN VIVO', '#5fbf8a');
        if(retryInterval) { clearInterval(retryInterval); retryInterval = null; }
    });
})();
</script>
</body>
</html>
