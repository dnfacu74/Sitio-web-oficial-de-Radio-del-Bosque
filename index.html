<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a1f14" />
<meta name="description" content="Radio del Bosque, La Plata, Buenos Aires, Argentina - emisora digital independiente y transmisión en vivo." />
<title>Radio del Bosque, La Plata, Buenos Aires, Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
:root {
--bg-primary: #0a0f0d;
--bg-secondary: #0f1a14;
--bg-tertiary: #142218;
--green-dark: #1a3d2e;
--green-mid: #2d5a3f;
--green-light: #4a8b6a;
--green-accent: #5fbf8a;
--gold: #d4a574;
--gold-light: #e8c49a;
--orange: #c97b3a;
--orange-light: #e89850;
--text-primary: #f5f0e8;
--text-secondary: #b8b0a0;
--text-muted: #7a7568;
--red-live: #e63946;
--font-display: 'Playfair Display', serif;
--font-body: 'Inter', sans-serif;
--font-title: 'Bebas Neue', sans-serif;
--shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
--shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
--shadow-glow: 0 0 20px rgba(95, 191, 138, 0.3);
--radius-sm: 8px;
--radius-md: 12px;
--radius-lg: 20px;
--radius-full: 9999px;
--transition-fast: 0.2s ease;
--transition-normal: 0.3s ease;
--transition-slow: 0.5s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
font-family: var(--font-body);
background: var(--bg-primary);
color: var(--text-primary);
line-height: 1.6;
overflow-x: hidden;
-webkit-font-smoothing: antialiased;
}
.container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.section-title {
font-family: var(--font-title);
font-size: clamp(2rem, 5vw, 3.5rem);
color: var(--text-primary);
text-align: center;
letter-spacing: 0.15em;
margin-bottom: 16px;
text-transform: uppercase;
}
.section-subtitle {
font-size: clamp(0.9rem, 2vw, 1.1rem);
color: var(--text-secondary);
text-align: center;
max-width: 600px;
margin: 0 auto 48px;
font-weight: 300;
}
.divider {
width: 80px; height: 3px;
background: linear-gradient(90deg, var(--green-accent), var(--gold));
margin: 0 auto 32px;
border-radius: var(--radius-full);
}
.text-accent { color: var(--green-accent); }
.text-gold { color: var(--gold); }
.btn {
display: inline-flex; align-items: center; gap: 10px;
padding: 14px 28px; border: none; border-radius: var(--radius-full);
font-family: var(--font-body); font-size: 0.95rem; font-weight: 600;
cursor: pointer; transition: all var(--transition-normal);
text-decoration: none; letter-spacing: 0.05em;
}
.btn-primary {
background: linear-gradient(135deg, var(--green-accent), var(--green-mid));
color: white; box-shadow: var(--shadow-glow);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(95, 191, 138, 0.5); }
.btn-secondary {
background: transparent; color: var(--text-primary);
border: 2px solid var(--green-accent);
}
.btn-secondary:hover { background: var(--green-accent); color: var(--bg-primary); }
.btn-gold {
background: linear-gradient(135deg, var(--gold), var(--orange));
color: var(--bg-primary);
}
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212, 165, 116, 0.4); }
/* HEADER */
.header {
position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
padding: 20px 0; transition: all var(--transition-normal);
background: rgba(10, 15, 13, 0.95);
backdrop-filter: blur(20px);
}
.header__container { display: flex; align-items: center; justify-content: space-between; }
.header__brand {
display: flex; align-items: center; gap: 12px;
text-decoration: none; color: var(--text-primary);
}
.header__logo {
width: 48px; height: 48px; border-radius: 50%;
border: 2px solid var(--green-accent);
transition: transform var(--transition-normal);
}
.header__brand:hover .header__logo { transform: rotate(360deg); }
.header__brand-text { display: flex; flex-direction: column; }
.header__name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
.header__location { font-size: 0.75rem; color: var(--text-secondary); letter-spacing: 0.05em; }
.header__nav {
position: absolute; top: calc(100% + 12px); right: 24px;
display: none; flex-direction: column; align-items: stretch; gap: 4px;
min-width: 250px; padding: 12px;
background: rgba(15, 26, 20, 0.98); border: 1px solid rgba(95, 191, 138, 0.3);
border-radius: var(--radius-md); box-shadow: var(--shadow-lg); backdrop-filter: blur(20px);
}
.header__nav--open { display: flex; }
.header__link {
color: var(--text-primary); text-decoration: none;
font-size: 0.9rem; font-weight: 500;
padding: 12px 16px; border-radius: var(--radius-sm);
transition: all var(--transition-fast);
}
.header__link:hover { background: rgba(95, 191, 138, 0.15); color: var(--green-accent); }
.header__whatsapp {
display: inline-flex; align-items: center; gap: 8px;
background: #25d366; color: white; padding: 10px 20px;
border-radius: var(--radius-full); text-decoration: none;
font-weight: 600; font-size: 0.9rem; margin-left: 12px;
transition: all var(--transition-normal);
}
.header__whatsapp:hover { background: #128c7e; transform: translateY(-2px); }
.header__toggle {
display: inline-flex; align-items: center; gap: 8px;
background: rgba(95, 191, 138, 0.12); color: var(--text-primary);
border: 1px solid rgba(95, 191, 138, 0.45); border-radius: var(--radius-full);
cursor: pointer; padding: 10px 16px; font-family: var(--font-body); font-size: .8rem;
font-weight: 700; letter-spacing: .08em; transition: all var(--transition-normal);
}
.header__toggle:hover, .header__toggle[aria-expanded="true"] { background: var(--green-accent); color: var(--bg-primary); }
.header__toggle-icon { font-size: 1.1rem; line-height: 1; }
/* HERO */
.hero {
position: relative; min-height: 100vh;
display: flex; align-items: center; justify-content: center;
overflow: hidden; padding: 120px 0 80px;
}
.hero__background {
position: absolute; inset: 0;
background: linear-gradient(135deg, rgba(10, 15, 13, 0.85) 0%, rgba(26, 61, 46, 0.6) 100%),
url('images/bichos-5.jpg') center/cover no-repeat;
z-index: 0;
}
.hero__overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 0%, var(--bg-primary) 100%); }
.hero__vignette { position: absolute; inset: 0; box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8); }
.hero__content { position: relative; z-index: 1; text-align: center; max-width: 900px; animation: fadeInUp 1s ease; }
.hero__logo-top {
width: 180px; height: 180px;
margin: 24px auto;
border-radius: 50%;
border: 3px solid var(--gold);
box-shadow: 0 0 40px rgba(212, 165, 116, 0.4);
animation: float 3s ease-in-out infinite;
object-fit: cover;
background: var(--bg-secondary);
}
.hero__badge {
display: inline-flex; align-items: center; gap: 10px;
padding: 8px 20px; background: rgba(230, 57, 70, 0.2);
border: 1px solid var(--red-live); border-radius: var(--radius-full);
font-size: 0.8rem; font-weight: 600; letter-spacing: 0.15em;
color: var(--red-live); margin-bottom: 24px;
animation: pulse 2s ease-in-out infinite;
}
.hero__live-dot { width: 8px; height: 8px; background: var(--red-live); border-radius: 50%; box-shadow: 0 0 10px var(--red-live); }
.hero__title {
font-family: var(--font-title);
font-size: clamp(3rem, 12vw, 8rem);
line-height: 0.95; letter-spacing: 0.05em;
margin-bottom: 24px; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.hero__title-line { display: block; color: var(--text-primary); }
.hero__title-line--accent {
background: linear-gradient(135deg, var(--green-accent), var(--gold));
-webkit-background-clip: text; background-clip: text;
-webkit-text-fill-color: transparent; color: transparent;
}
.hero__subtitle {
font-size: clamp(1rem, 2.5vw, 1.3rem);
color: var(--text-secondary); letter-spacing: 0.2em;
text-transform: uppercase; margin-bottom: 16px; font-weight: 300;
}
.hero__studio {
font-family: var(--font-display);
font-size: clamp(1rem, 2vw, 1.2rem);
color: var(--gold); font-style: italic; margin-bottom: 48px;
}
.hero__brands-title {
display: block; margin: 24px auto 0; color: var(--gold-light);
font-family: var(--font-display); font-size: clamp(1.35rem, 3vw, 2rem);
font-weight: 700; text-decoration: none; letter-spacing: .04em;
transition: color var(--transition-normal), transform var(--transition-normal);
}
.hero__brands-title:hover { color: var(--green-accent); transform: translateY(-2px); }
.hero__brands-gallery { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 18px auto 0; width: min(100%, 850px); flex-wrap: wrap; }
.hero__brand-thumb { width: 180px; height: 122px; padding: 5px; border: 1px solid var(--gold); border-radius: 10px; background: rgba(15,26,20,.9); cursor: pointer; box-shadow: 0 5px 16px rgba(0,0,0,.35); transition: transform var(--transition-normal), box-shadow var(--transition-normal); }
.hero__brand-thumb:hover { transform: translateY(-4px); box-shadow: 0 9px 22px rgba(212,165,116,.3); }
.hero__brand-thumb:focus-visible { outline: 3px solid var(--green-accent); outline-offset: 3px; }
.hero__brand-thumb img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 6px; background: #fff; }
.hero-brands-lightbox { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 22px; background: rgba(0,0,0,.9); opacity: 0; pointer-events: none; transition: opacity var(--transition-normal); }
.hero-brands-lightbox.active { opacity: 1; pointer-events: auto; }
.hero-brands-lightbox__box { position: relative; width: min(760px, 100%); padding: 22px; border: 1px solid var(--gold); border-radius: var(--radius-lg); background: var(--bg-secondary); box-shadow: var(--shadow-lg); text-align: center; }
.hero-brands-lightbox__image { display: block; width: 100%; max-height: 62vh; object-fit: contain; border-radius: var(--radius-sm); background: #fff; }
.hero-brands-lightbox__title { margin-top: 16px; color: var(--gold-light); font-family: var(--font-display); font-size: 1.7rem; }
.hero-brands-lightbox__description { margin: 8px auto 0; max-width: 620px; color: var(--text-secondary); line-height: 1.6; }
.hero-brands-lightbox__close { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; color: var(--text-primary); background: rgba(0,0,0,.5); font-size: 1.4rem; cursor: pointer; }
.hero-brands-lightbox__close:hover { color: var(--bg-primary); background: var(--gold); }
.hero__actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.hero__scroll {
position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
display: flex; flex-direction: column; align-items: center; gap: 8px;
color: var(--text-muted); font-size: 0.75rem; letter-spacing: 0.2em;
}
.hero__scroll-indicator {
width: 2px; height: 40px;
background: linear-gradient(to bottom, var(--green-accent), transparent);
animation: float 2s ease-in-out infinite;
}
/* --- NUEVO ESTILO: REPRODUCTOR DE RADIO HTML5 --- */
.radio-player-widget {
background: rgba(15, 26, 20, 0.85);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(95, 191, 138, 0.3);
border-radius: var(--radius-lg);
padding: 20px 24px;
margin: 0 auto 32px;
max-width: 500px;
width: 100%;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
display: flex;
flex-direction: column;
gap: 16px;
position: relative;
overflow: hidden;
transition: all var(--transition-normal);
}
.radio-player-widget:hover {
border-color: var(--green-accent);
box-shadow: 0 8px 40px rgba(95, 191, 138, 0.15);
}
/* Barra superior de estado */
.rp-status-bar {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 0.1em;
font-weight: 600;
}
.rp-status-indicator {
display: flex;
align-items: center;
gap: 6px;
color: var(--text-muted);
transition: color var(--transition-fast);
}
.rp-status-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background-color: var(--text-muted);
transition: background-color var(--transition-fast);
}
/* Estados del indicador */
.rp-status-indicator.live { color: var(--red-live); }
.rp-status-indicator.live .rp-status-dot {
background-color: var(--red-live);
box-shadow: 0 0 8px var(--red-live);
animation: pulse 1.5s infinite;
}
.rp-status-indicator.loading { color: var(--gold); }
.rp-status-indicator.loading .rp-status-dot {
background-color: var(--gold);
animation: spin 1s linear infinite; /* Definido más abajo */
}
.rp-volume-control {
display: flex;
align-items: center;
gap: 8px;
color: var(--text-secondary);
}
.rp-volume-slider {
-webkit-appearance: none;
width: 80px;
height: 4px;
background: rgba(255,255,255,0.2);
border-radius: 2px;
outline: none;
cursor: pointer;
}
.rp-volume-slider::-webkit-slider-thumb {
-webkit-appearance: none;
width: 12px;
height: 12px;
border-radius: 50%;
background: var(--green-accent);
cursor: pointer;
transition: transform 0.2s;
}
.rp-volume-slider::-webkit-slider-thumb:hover {
transform: scale(1.2);
}
/* Controles principales */
.rp-main-controls {
display: flex;
align-items: center;
gap: 20px;
}
.rp-play-btn {
width: 64px;
height: 64px;
border-radius: 50%;
background: linear-gradient(135deg, var(--green-accent), var(--green-mid));
border: none;
color: white;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
box-shadow: 0 4px 15px rgba(95, 191, 138, 0.4);
transition: all var(--transition-normal);
flex-shrink: 0;
}
.rp-play-btn:hover {
transform: scale(1.05);
box-shadow: 0 6px 20px rgba(95, 191, 138, 0.6);
}
.rp-play-btn:active {
transform: scale(0.95);
}
.rp-play-btn svg {
width: 28px;
height: 28px;
fill: currentColor;
}
.rp-info {
display: flex;
flex-direction: column;
justify-content: center;
overflow: hidden;
}
.rp-station-name {
font-family: var(--font-display);
font-size: 1.4rem;
font-weight: 700;
color: var(--text-primary);
margin-bottom: 4px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.rp-stream-label {
font-size: 0.85rem;
color: var(--green-accent);
font-weight: 500;
letter-spacing: 0.05em;
}
/* Mensaje de error */
.rp-error-msg {
background: rgba(230, 57, 70, 0.15);
border: 1px solid var(--red-live);
color: #ffcccc;
padding: 10px;
border-radius: var(--radius-sm);
font-size: 0.85rem;
text-align: center;
display: none; /* Oculto por defecto */
margin-top: 10px;
}
/* Fallback para Autoplay Bloqueado */
.rp-autoplay-fallback {
position: absolute;
inset: 0;
background: rgba(10, 15, 13, 0.95);
backdrop-filter: blur(5px);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 10;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
}
.rp-autoplay-fallback.visible {
opacity: 1;
pointer-events: all;
}
.rp-fallback-btn {
background: var(--green-accent);
color: var(--bg-primary);
border: none;
padding: 12px 24px;
border-radius: var(--radius-full);
font-weight: 700;
font-size: 1rem;
cursor: pointer;
display: flex;
align-items: center;
gap: 8px;
transition: transform 0.2s;
}
.rp-fallback-btn:hover {
transform: scale(1.05);
background: var(--gold);
}
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
@media (max-width: 768px) {
.radio-player-widget {
padding: 16px;
margin-bottom: 24px;
}
.rp-play-btn {
width: 56px;
height: 56px;
}
.rp-station-name {
font-size: 1.2rem;
}
}
/* --- FIN ESTILOS REPRODUCTOR --- */

/* LIVE */
.live-section { padding: 80px 0; background: var(--bg-primary); }
.section-header { text-align: center; margin-bottom: 48px; }
.live-grid { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: stretch; }
.live-video { background: var(--bg-secondary); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid rgba(95, 191, 138, 0.2); }
.live-video__header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: rgba(0, 0, 0, 0.3); }
.live-video__badge {
display: inline-flex; align-items: center; gap: 8px;
background: var(--red-live); color: white; padding: 6px 14px;
border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em;
}
.live-video__dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
.live-video__platform { font-size: 0.85rem; color: var(--text-secondary); }
.live-video__container { aspect-ratio: 16/9; background: #000; }
.live-video__container iframe { width: 100%; height: 100%; border: none; }
.live-video__description { padding: 20px 24px; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; }
/* ABOUT */
.about-section { padding: 100px 0; background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%); }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.about-label { display: inline-block; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.2em; color: var(--gold); margin-bottom: 16px; }
.about-title { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; color: var(--text-primary); margin-bottom: 24px; }
.about-text { font-size: 1.05rem; color: var(--text-secondary); line-height: 1.8; margin-bottom: 20px; }
.about-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 40px 0; padding: 32px 0; border-top: 1px solid rgba(95, 191, 138, 0.2); border-bottom: 1px solid rgba(95, 191, 138, 0.2); }
.about-stat { display: flex; flex-direction: column; text-align: center; }
.about-stat__value { font-family: var(--font-title); font-size: 2.5rem; color: var(--green-accent); letter-spacing: 0.05em; }
.about-stat__label { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
.about-image__frame {
position: relative; border-radius: var(--radius-lg); overflow: hidden;
box-shadow: var(--shadow-lg); border: 2px solid rgba(95, 191, 138, 0.3);
}
.about-image__frame img { width: 100%; height: auto; display: block; transition: transform var(--transition-slow); }
.about-image__frame:hover img { transform: scale(1.05); }
.about-image__caption {
position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 24px;
background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
color: var(--text-primary); font-family: var(--font-display); font-style: italic; z-index: 2;
}
/* PROGRAMMING */
.programming-section { padding: 100px 0; background: var(--bg-primary); }
.programming-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.program-card {
background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
border: 1px solid rgba(95, 191, 138, 0.15); border-radius: var(--radius-md);
overflow: hidden; transition: all var(--transition-normal); cursor: pointer;
}
.program-card:hover { transform: translateY(-4px); border-color: var(--green-accent); box-shadow: var(--shadow-md); }
.program-card__image { position: relative; aspect-ratio: 16/9; overflow: hidden; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary)); }
.program-card__image img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-slow); display: block; }
.program-card:hover .program-card__image img { transform: scale(1.05); }
.program-card__image-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent); }
.program-card__icon-badge {
position: absolute; top: 16px; right: 16px;
width: 40px; height: 40px; border-radius: 50%;
background: rgba(95, 191, 138, 0.9);
display: flex; align-items: center; justify-content: center;
font-size: 1.2rem; color: white; backdrop-filter: blur(4px);
}
.program-card__soon-badge {
position: absolute; top: 16px; left: 16px; z-index: 2;
padding: 6px 14px; border-radius: var(--radius-full);
background: linear-gradient(135deg, var(--gold), var(--orange));
color: var(--bg-primary); font-size: 0.7rem; font-weight: 700;
letter-spacing: 0.1em; text-transform: uppercase;
}
.program-card__content { padding: 24px; }
.program-card__category { font-size: 0.75rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px; display: block; }
.program-card__title { font-family: var(--font-display); font-size: 1.4rem; color: var(--text-primary); margin-bottom: 12px; }
.program-card__meta { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.program-card__time, .program-card__days { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-secondary); }
.program-card__desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
.program-card__host { font-size: 0.95rem; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 16px; font-style: italic; }
.programs-cta {
margin-top: 56px;

html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
.radio-shell-content { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg-primary); }
.radio-player-widget { position: fixed; z-index: 20000; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(500px, calc(100vw - 24px)); max-height: calc(100vh - 28px); margin: 0; }
@media (max-width: 768px) { .radio-player-widget { bottom: 8px; width: calc(100vw - 16px); margin: 0; } }
</style>
</head>
<body>
<iframe class="radio-shell-content" id="radioContent" name="radio-content" title="Sitio web de Radio del Bosque" allow="autoplay" src="radio-site.html"></iframe>
<div class="radio-player-widget" id="radioPlayerWidget">
<!-- Elemento de Audio Oculto -->
<audio
id="radioPlayer"
preload="auto"
src="https://radios.solumedia.com/6060/stream">
Tu navegador no soporta audio HTML5.
</audio>
<!-- Overlay para Autoplay Bloqueado -->
<div class="rp-autoplay-fallback" id="autoplayFallback">
<button class="rp-fallback-btn" id="fallbackBtn">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
Escuchar en vivo
</button>
</div>
<!-- Barra de Estado Superior -->
<div class="rp-status-bar">
<div class="rp-status-indicator loading" id="statusIndicator">
<div class="rp-status-dot"></div>
<span id="statusText">Cargando...</span>
</div>
<div class="rp-volume-control">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
<input type="range" min="0" max="1" step="0.1" value="1" class="rp-volume-slider" id="volumeSlider">
</div>
</div>
<!-- Controles Principales -->
<div class="rp-main-controls">
<button class="rp-play-btn" id="playPauseBtn" aria-label="Reproducir">
<!-- Icono Play (visible por defecto) -->
<svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
<!-- Icono Pause (oculto por defecto) -->
<svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
</button>
<div class="rp-info">
<div class="rp-station-name">Radio del Bosque</div>
<div class="rp-stream-label">Streaming en vivo</div>
</div>
</div>
<!-- Mensaje de Error -->
<div class="rp-error-msg" id="errorMsg">
La transmisión está fuera de línea por el momento. Se reconectará cuando vuelva la señal.
</div>
</div>
<script>
(() => {
  const player = document.getElementById('radioPlayer');
  const playBtn = document.getElementById('playPauseBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const statusIndicator = document.getElementById('statusIndicator');
  const statusText = document.getElementById('statusText');
  const volumeSlider = document.getElementById('volumeSlider');
  const errorMsg = document.getElementById('errorMsg');
  const autoplayFallback = document.getElementById('autoplayFallback');
  const fallbackBtn = document.getElementById('fallbackBtn');
  if (!player || !playBtn || !iconPlay || !iconPause || !statusIndicator || !statusText || !volumeSlider || !errorMsg || !autoplayFallback || !fallbackBtn) return;

  let userPaused = false;
  let attemptId = 0;
  let retryTimer = null;
  const scheduleReconnect = () => {
    if (userPaused || retryTimer !== null) return;
    retryTimer = window.setTimeout(() => {
      retryTimer = null;
      startPlayback();
    }, 15000);
  };
  const setState = (state, message) => {
    statusIndicator.classList.remove('live', 'loading');
    errorMsg.style.display = 'none';
    if (state === 'playing') {
      if (retryTimer !== null) window.clearTimeout(retryTimer);
      retryTimer = null;
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
      statusIndicator.classList.add('live');
      statusText.textContent = 'EN VIVO';
      autoplayFallback.classList.remove('visible');
    } else if (state === 'loading') {
      statusIndicator.classList.add('loading');
      statusText.textContent = 'Conectando...';
    } else if (state === 'paused') {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
      statusText.textContent = message || 'Pausado';
    } else if (state === 'error') {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
      statusText.textContent = 'Sin conexión';
      errorMsg.textContent = message || 'No se pudo conectar con la transmisión. Volvé a intentar.';
      errorMsg.style.display = 'block';
    }
  };

  const startPlayback = async (fromUserGesture = false) => {
    if (userPaused && !fromUserGesture) return;
    if (fromUserGesture) userPaused = false;
    const thisAttempt = ++attemptId;
    setState('loading');
    try {
      await player.play();
      if (thisAttempt === attemptId) setState('playing');
    } catch (error) {
      if (thisAttempt !== attemptId || error.name === 'AbortError') return;
      if (error.name === 'NotAllowedError') {
        setState('paused', 'Tocá para escuchar');
        autoplayFallback.classList.add('visible');
      } else {
        setState('error', 'La transmisión está fuera de línea o no responde. Se reintentará automáticamente.');
        scheduleReconnect();
      }
    }
  };

  playBtn.addEventListener('click', () => {
    if (player.paused) startPlayback(true);
    else {
      userPaused = true;
      attemptId++;
      if (retryTimer !== null) window.clearTimeout(retryTimer);
      retryTimer = null;
      player.pause();
      setState('paused');
    }
  });
  fallbackBtn.addEventListener('click', () => startPlayback(true));
  volumeSlider.addEventListener('input', () => { player.volume = Number(volumeSlider.value); });
  player.addEventListener('playing', () => setState('playing'));
  player.addEventListener('pause', () => { if (!player.ended) setState('paused'); });
  player.addEventListener('waiting', () => setState('loading'));
  player.addEventListener('error', () => {
    if (userPaused) return;
    setState('error', 'La transmisión está fuera de línea o no responde. Se reintentará automáticamente.');
    scheduleReconnect();
  });
  player.volume = Number(volumeSlider.value);

  // Intento inmediato al entrar. Si el navegador lo bloquea, se muestra el botón
  // de activación; la política del navegador no permite forzar audio con sonido.
  startPlayback();
})();
</script>
<script>
(() => {
  const frame = document.getElementById('radioContent');
  const allowedPages = new Set(['radio-site.html', 'home.html', 'marcas.html', 'novedades.html', 'eventos.html', 'programas.html', 'encuentros-en-el-bosque-audios.html']);
  const requestedPage = new URLSearchParams(window.location.search).get('page');
  if (requestedPage && allowedPages.has(requestedPage)) frame.src = requestedPage;
})();
</script>
