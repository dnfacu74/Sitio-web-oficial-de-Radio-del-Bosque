<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a1f14" />
<meta name="description" content="Radio del Bosque, Patagonia Argentina. Escuchá la radio mientras recorrés nuestro sitio." />
<title>Radio del Bosque | Radio en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root { --bg:#080d0b; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
.radio-shell { width:100%; height:100%; position:relative; }
.radio-content { display:block; width:100%; height:100%; border:0; background:var(--bg); }
#persistentAudio { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div class="radio-shell">
  <iframe class="radio-content" id="radioContent" name="radio-content" src="home.html?v=2" title="Contenido de Radio del Bosque" allow="autoplay"></iframe>
  <audio id="persistentAudio" preload="none" src="https://radios.solumedia.com/6318/stream">Tu navegador no soporta audio HTML5.</audio>
</div>
<script>
(() => {
  'use strict';
  const audio = document.getElementById('persistentAudio');
  const frame = document.getElementById('radioContent');
  const pages = new Set(['home.html','marcas.html','novedades.html','eventos.html','programas.html','encuentros-en-el-bosque-audios.html']);
  let reconnectTimer = null;
  let reconnectAttempts = 0;
  const styleText = `
    .rb-player { width:min(90%,900px); margin:24px auto 34px; padding:20px 28px 18px; border:1px solid #5fbf8a; border-radius:28px; background:rgba(7,31,20,.78); color:#f5f0e8; font-family:Inter,Arial,sans-serif; box-shadow:0 0 25px rgba(95,191,138,.10); }
    .rb-player * { box-sizing:border-box; }
    .rb-player-head { display:flex; justify-content:space-between; align-items:center; gap:15px; color:#74d99c; font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .rb-live { display:flex; align-items:center; gap:8px; }
    .rb-live-dot { width:13px; height:13px; display:inline-block; border-radius:50%; background:#74d99c; box-shadow:0 0 10px #74d99c; }
    .rb-volume { display:flex; align-items:center; gap:8px; color:#f5f0e8; font-size:20px; }
    .rb-volume input { width:150px; accent-color:#5fbf8a; }
    .rb-main { display:flex; align-items:center; gap:16px; padding:10px 12px 12px; }
    .rb-button { width:58px; height:58px; flex:0 0 58px; border:0; border-radius:50%; display:grid; place-items:center; background:linear-gradient(145deg,#f2c57e,#b57935); color:#fff; cursor:pointer; box-shadow:0 0 14px rgba(212,165,116,.42); }
    .rb-button:hover { filter:brightness(1.08); transform:scale(1.02); }
    .rb-button:focus-visible { outline:3px solid #d4a574; outline-offset:4px; }
    .rb-button svg { width:25px; height:25px; fill:currentColor; }
    .rb-title { margin:0 0 9px; font:700 clamp(22px,3vw,32px)/1.2 'Playfair Display',Georgia,serif; }
    .rb-status { margin:0; color:#67d797; font-size:clamp(16px,2.2vw,22px); font-weight:600; }
    .rb-line { height:1px; background:rgba(95,191,138,.7); }
    @media (max-width:600px) { .rb-player { width:88%; padding:18px 16px 16px; border-radius:24px; } .rb-player-head { font-size:12px; } .rb-volume { font-size:17px; } .rb-volume input { width:92px; } .rb-main { gap:16px; padding:13px 4px 20px; } .rb-button { width:54px; height:54px; flex-basis:54px; } .rb-button svg { width:23px; height:23px; } }
  `;
  function setState(button, status, playing, text) {
    button.querySelector('[data-play]').style.display = playing ? 'none' : 'block';
    button.querySelector('[data-pause]').style.display = playing ? 'block' : 'none';
    button.setAttribute('aria-label', playing ? 'Pausar radio' : 'Reproducir radio');
    status.textContent = text || (playing ? 'Streaming en vivo' : 'Presioná para escuchar');
  }
  function reconnect(button, status) {
    if (audio.paused || reconnectTimer) return;
    const delay = Math.min(30000, 1200 * Math.pow(2, reconnectAttempts++));
    status.textContent = 'Reconectando...';
    reconnectTimer = setTimeout(() => { reconnectTimer=null; audio.load(); audio.play().catch(() => reconnect(button,status)); }, delay);
  }
  function addPlayer() {
    try {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById('radioBosquePlayer')) return;
      const css = doc.createElement('style'); css.id='radioBosquePlayerCss'; css.textContent=styleText; doc.head.appendChild(css);
      const all = [...doc.querySelectorAll('h1,h2,h3,h4,p,span,div')];
      const normalized = el => el.textContent.replace(/\s+/g,' ').trim().toLowerCase();
      const study = all.find(el => normalized(el) === 'estudio marta navarro') || all.find(el => normalized(el).includes('estudio marta navarro'));
      const player = doc.createElement('section'); player.id='radioBosquePlayer'; player.className='rb-player'; player.setAttribute('aria-label','Reproductor de Radio del Bosque');
      player.innerHTML = `<div class="rb-player-head"><span class="rb-live"><span class="rb-live-dot"></span>EN VIVO</span><label class="rb-volume" aria-label="Volumen"><span aria-hidden="true">&#128266;</span><input type="range" min="0" max="1" step="0.05" value="1" data-volume></label></div><div class="rb-main"><button class="rb-button" type="button" aria-label="Reproducir radio"><svg data-play viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg><svg data-pause viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg></button><div><h2 class="rb-title">Radio del Bosque</h2><p class="rb-status">Streaming en vivo</p></div></div><div class="rb-line"></div>`;
      if (study) { study.insertAdjacentElement('afterend', player); }
      else { (doc.querySelector('main') || doc.body).appendChild(player); }
      const button=player.querySelector('.rb-button'), status=player.querySelector('.rb-status'), volume=player.querySelector('[data-volume]');
      const saved=localStorage.getItem('radioVolume'); if(saved!==null){ audio.volume=Number(saved); volume.value=saved; }
      button.addEventListener('click', () => { if(audio.paused){ status.textContent='Conectando...'; audio.play().catch(()=>setState(button,status,false,'Presioná para escuchar')); } else { audio.pause(); clearTimeout(reconnectTimer); reconnectTimer=null; reconnectAttempts=0; } });
      volume.addEventListener('input', () => { audio.volume=Number(volume.value); localStorage.setItem('radioVolume',volume.value); });
      audio.addEventListener('playing',()=>setState(button,status,true,'Streaming en vivo'));
      audio.addEventListener('pause',()=>setState(button,status,false,'Presioná para escuchar'));
      audio.addEventListener('waiting',()=>reconnect(button,status));
      audio.addEventListener('stalled',()=>reconnect(button,status));
      audio.addEventListener('error',()=>reconnect(button,status));
    } catch(e) { console.warn('No se pudo insertar el reproductor.',e); }
  }
  function go(url) {
    const u=new URL(url,window.location.href); if(u.origin!==window.location.origin) return false;
    const page=u.pathname.split('/').pop()||'index.html';
    if(page==='index.html'||page===''){ frame.src='home.html'+u.hash; return true; }
    if(pages.has(page)){ frame.src=page+u.search+u.hash; return true; }
    return false;
  }
  frame.addEventListener('load',()=>{ addPlayer(); try { frame.contentDocument.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href]'); if(!a||a.target==='_blank')return; const h=a.getAttribute('href'); if(!h||h[0]==='#'||h.startsWith('mailto:')||h.startsWith('tel:'))return; if(go(new URL(h,frame.contentWindow.location.href).href))e.preventDefault(); },true); } catch(e){} });
})();
</script>
</body>
</html>
